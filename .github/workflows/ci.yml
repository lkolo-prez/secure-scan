name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in secure-scan.sh lib/*.sh; do bash -n "$f"; done
      - name: ShellCheck (errors only)
        run: |
          shellcheck -S error -e SC1090,SC1091 secure-scan.sh lib/*.sh

  smoke:
    name: Smoke test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version & help
        run: |
          ./secure-scan.sh --version
          ./secure-scan.sh --help
      - name: Fast scan (files module, JSON)
        run: |
          ./secure-scan.sh --only files --json | tee out.json
          grep -q '"tool":"secure-scan"' out.json
