name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in secure-scan.sh lib/*.sh tests/*.sh scripts/*.sh build-app.sh make-dmg.sh install.sh; do bash -n "$f"; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error -e SC1090,SC1091 secure-scan.sh lib/*.sh tests/*.sh scripts/*.sh
      - name: Security self-audit
        run: bash scripts/security-audit.sh

  test-build:
    name: Test & build app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite
        run: bash tests/run-tests.sh
      - name: Version & help
        run: |
          ./secure-scan.sh --version
          ./secure-scan.sh --help
      - name: Fast scan (files module, JSON)
        run: |
          ./secure-scan.sh --only files --json | tee out.json
          grep -q '"tool":"secure-scan"' out.json
      - name: Build native app (SecureScan.app)
        run: |
          ./build-app.sh
          test -d dist/SecureScan.app/Contents/MacOS
          codesign --verify --verbose dist/SecureScan.app
      - name: Build DMG
        run: |
          ./make-dmg.sh
          ls -lh dist/*.dmg
